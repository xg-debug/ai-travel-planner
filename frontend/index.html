<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI旅行规划器 - 智能旅行助手</title>
    <meta name="description" content="AI智能旅行规划器，为您生成个性化的旅行行程，提供实时地图、天气和推荐。" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Source+Code+Pro:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- Theme color -->
    <meta name="theme-color" content="#1e88e5">
    
    <!-- Open Graph -->
    <meta property="og:title" content="AI旅行规划器 - 智能旅行助手">
    <meta property="og:description" content="AI智能旅行规划器，为您生成个性化的旅行行程，提供实时地图、天气和推荐。">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/travel-planner-og.png">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="AI旅行规划器 - 智能旅行助手">
    <meta name="twitter:description" content="AI智能旅行规划器，为您生成个性化的旅行行程，提供实时地图、天气和推荐。">
  </head>
  <body class="bg-gradient-to-br from-travel-sky/5 via-white to-travel-mint/5 text-travel-ocean font-chinese antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    
    <!-- Loading animation -->
    <div id="loading" class="fixed inset-0 z-50 flex items-center justify-center bg-white/95 backdrop-blur-sm transition-opacity duration-500">
      <div class="text-center">
        <div class="relative inline-block">
          <div class="w-16 h-16 border-4 border-travel-ocean border-t-transparent rounded-full animate-spin"></div>
          <div class="absolute inset-0 flex items-center justify-center">
            <div class="w-8 h-8 bg-gradient-to-r from-travel-ocean to-travel-mint rounded-full animate-pulse"></div>
          </div>
        </div>
        <p class="mt-4 font-chinese text-lg text-travel-ocean animate-pulse">正在启动AI旅行规划器...</p>
        <div class="mt-2 h-1 w-48 bg-travel-sky/20 rounded-full overflow-hidden">
          <div class="h-full bg-gradient-to-r from-travel-ocean to-travel-mint animate-progress"></div>
        </div>
      </div>
    </div>
    
    <script>
      // Hide loading screen when app is mounted
      window.addEventListener('load', () => {
        setTimeout(() => {
          const loading = document.getElementById('loading');
          if (loading) {
            loading.style.opacity = '0';
            setTimeout(() => loading.style.display = 'none', 500);
          }
        }, 1000);
      });
    </script>
  </body>
</html>
